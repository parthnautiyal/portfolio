name: Sync Overleaf Resume

on:
  workflow_dispatch:
    inputs:
      overleaf_url:
        description: 'Overleaf Share URL (e.g. https://www.overleaf.com/read/xxxx)'
        required: false
        type: string
  schedule:
    # Optional daily trigger at 06:00 UTC
    - cron: '0 6 * * *'

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install PDF rasterizer
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Fetch resume source & compiled PDF from Overleaf
        env:
          # Passed via env, not interpolated into the script, to avoid shell injection from the dispatch input.
          OVERLEAF_URL: ${{ inputs.overleaf_url || secrets.OVERLEAF_SHARE_URL }}
        run: |
          [ -n "$OVERLEAF_URL" ] || { echo "::error::OVERLEAF_SHARE_URL secret is not set"; exit 1; }
          bash scripts/fetch-overleaf.sh "$OVERLEAF_URL" /tmp/overleaf
          # Every compile yields a byte-different PDF, so gate on the source to avoid no-op commits.
          if cmp -s /tmp/overleaf/resume.tex portfolio-frontend/public/Parth_Nautiyal_Resume.tex; then
            echo "Overleaf source unchanged."
            exit 0
          fi
          # The parser reads the copy under portfolio-frontend/public first; keep both in sync.
          cp /tmp/overleaf/resume.tex Parth_Nautiyal_Resume.tex
          cp /tmp/overleaf/resume.tex portfolio-frontend/public/Parth_Nautiyal_Resume.tex
          cp /tmp/overleaf/resume.pdf portfolio-frontend/public/Parth_Nautiyal_Resume.pdf

      - name: Parse Resume & Sync TypeScript Content
        run: node scripts/parse-resume-tex.js

      - name: Commit & Push Changes
        id: commit_step
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Parth_Nautiyal_Resume.tex portfolio-frontend/public/Parth_Nautiyal_Resume.tex portfolio-frontend/public/Parth_Nautiyal_Resume.pdf portfolio-frontend/public/resume-preview.png portfolio-frontend/src/app/content/
          if git diff --staged --quiet; then
            echo "No changes detected in resume data or PDF."
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore(resume): automated sync from Overleaf [skip ci]"
            git push origin main
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Trigger Vercel Deploy Hook
        if: steps.commit_step.outputs.has_changes == 'true' && env.VERCEL_HOOK != ''
        env:
          VERCEL_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Vercel deployment..."
          curl -sf -X POST "$VERCEL_HOOK"
          echo "Vercel deploy triggered successfully."
