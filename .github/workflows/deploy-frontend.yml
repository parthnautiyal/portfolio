name: Deploy Frontend to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'portfolio-frontend/**'
      - '.github/workflows/deploy-frontend.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Vercel deploy
        run: curl -s "${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"

      - name: Job summary
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then BADGE="✅ deployed"; else BADGE="❌ failed"; fi
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## $BADGE — portfolio-frontend (Vercel)

          | Field | Value |
          |---|---|
          | Commit | [\`${GITHUB_SHA::7}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) |
          | Actor | ${{ github.actor }} |
          | Frontend | https://parthnautiyal.vercel.app |
          EOF
