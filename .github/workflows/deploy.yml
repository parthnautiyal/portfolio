name: Build & Deploy Native Image

on:
  push:
    branches: [main]
    paths:
      - 'portfolio-backend/**'
      - '.github/workflows/deploy.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/portfolio-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push native image
        uses: docker/build-push-action@v6
        with:
          context: ./portfolio-backend
          file: ./portfolio-backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          # Layer cache cuts GraalVM rebuild time ~40% on cache hit
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger Render deploy
        run: curl -s "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Job summary
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then BADGE="✅ deployed"; else BADGE="❌ failed"; fi
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## $BADGE — portfolio-backend native image

          | Field | Value |
          |---|---|
          | Commit | [\`${GITHUB_SHA::7}\`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) |
          | Actor | ${{ github.actor }} |
          | Image | \`ghcr.io/parthnautiyal/portfolio-backend:latest\` |
          | Runtime | GraalVM Native Image · Java 21 · debian:bookworm-slim |
          | Backend | https://portfolio-zs63.onrender.com |
          | Frontend | https://parthnautiyal.vercel.app |

          **Endpoints**
          \`\`\`
          GET  /api/github
          GET  /api/projects
          POST /api/chat
          POST /api/contact
          POST /api/job-match
          POST /api/update-content
          POST /api/webhook/github
          \`\`\`
          EOF
