<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0.5" stdDeviation="0.8" flood-color="#f97316" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Deep Slate Squircle Container -->
  <rect width="32" height="32" rx="7.5" fill="url(#bgGrad)"/>
  <rect width="30" height="30" x="1" y="1" rx="6.5" fill="none" stroke="url(#brandGrad)" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Developer Terminal & Systems Core Glyph (>_) -->
  <path
    d="M 8.5 10.5 L 14.5 16 L 8.5 21.5"
    fill="none"
    stroke="url(#brandGrad)"
    stroke-width="3"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />
  <line
    x1="17.5"
    y1="21.5"
    x2="24"
    y2="21.5"
    stroke="#38bdf8"
    stroke-width="3"
    stroke-linecap="round"
  />
</svg>
