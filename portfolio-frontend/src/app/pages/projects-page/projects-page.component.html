<section id="projects" class="py-16 animate-fade-up">
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 border-b border-slate-200/40 dark:border-slate-800/40 pb-4">
    <div>
      <h2 class="section-heading">Projects</h2>
      <p class="text-sm text-slate-500 dark:text-slate-400 mt-2">
        Resume projects are pinned · others sorted by your selection
      </p>
    </div>
    <div class="flex items-center gap-2">
      <label htmlFor="project-sort" class="text-xs font-bold text-slate-400 uppercase tracking-wider">
        Sort By
      </label>
      <select
        id="project-sort"
        [value]="sortBy"
        (change)="onSortChange($event)"
        class="text-xs rounded-xl glass-panel px-3 py-2 outline-none dark:bg-slate-900 border-none cursor-pointer text-[var(--color-text)]"
      >
        <option value="updated">Latest Updated</option>
        <option value="stars">Most Stars</option>
        <option value="forks">Most Forks</option>
      </select>
    </div>
  </div>

  <div class="mt-8 grid gap-6 md:grid-cols-2 lg:grid-cols-3">
    <!-- Loading skeleton -->
    <ng-container *ngIf="loading">
      <div *ngFor="let i of [1, 2, 3]" class="card-elevated flex flex-col justify-between p-5 animate-pulse">
        <div class="space-y-3">
          <div class="flex items-start justify-between">
            <div class="h-4 w-3/4 bg-slate-200 dark:bg-slate-700 rounded"></div>
            <div class="h-4 w-4 bg-slate-200 dark:bg-slate-700 rounded"></div>
          </div>
          <div class="space-y-2">
            <div class="h-3 w-full bg-slate-200 dark:bg-slate-700 rounded"></div>
            <div class="h-3 w-5/6 bg-slate-200 dark:bg-slate-700 rounded"></div>
          </div>
          <div class="flex gap-1.5">
            <div class="h-5 w-16 bg-slate-200 dark:bg-slate-700 rounded-full"></div>
            <div class="h-5 w-20 bg-slate-200 dark:bg-slate-700 rounded-full"></div>
            <div class="h-5 w-14 bg-slate-200 dark:bg-slate-700 rounded-full"></div>
          </div>
        </div>
        <div class="mt-4">
          <div class="h-3 w-32 bg-slate-200 dark:bg-slate-700 rounded"></div>
        </div>
      </div>
    </ng-container>

    <!-- Project list -->
    <ng-container *ngIf="!loading">
      <a
        *ngFor="let project of displayProjects"
        [href]="project.url"
        target="_blank"
        rel="noopener noreferrer"
        [class]="'group glass-card flex flex-col justify-between p-5 cursor-pointer transition-all duration-300 hover:scale-[1.03] hover:-translate-y-1 hover:shadow-xl hover:shadow-blue-500/10 dark:hover:shadow-sky-400/10 hover:border-blue-500/30 dark:hover:border-sky-400/30 ' + (
          project.isResumeProject ? 'ring-1 ring-blue-500/20 dark:ring-sky-400/20' : ''
        )"
      >
        <div class="space-y-3">
          <div class="flex items-start justify-between gap-2">
            <h3 class="text-sm font-semibold text-slate-900 dark:text-slate-550 group-hover:text-blue-500 dark:group-hover:text-sky-400 transition-colors">
              {{ project.name }}
            </h3>
            <div class="flex items-center gap-1.5 shrink-0">
              <span *ngIf="project.isResumeProject" title="Featured in resume" class="text-blue-500 dark:text-sky-400">
                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
              </span>
              <svg class="text-slate-400 group-hover:text-blue-500 dark:group-hover:text-sky-400 transition-colors" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.3 3.438 9.8 8.205 11.385.6.11.82-.26.82-.577v-2.234c-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22v3.293c0 .319.22.694.825.576C20.565 21.795 24 17.3 24 12c0-6.63-5.37-12-12-12z"/></svg>
            </div>
          </div>
          <p *ngIf="project.description" class="text-[0.7rem] leading-relaxed text-slate-600 dark:text-slate-350 line-clamp-3">
            {{ project.description }}
          </p>
          <div class="flex flex-wrap gap-1">
            <span
              *ngFor="let tech of project.stack | slice:0:5"
              class="rounded-full bg-slate-100 dark:bg-slate-800/80 px-2 py-0.5 text-[0.6rem] font-medium text-slate-600 dark:text-slate-350 border border-slate-200/50 dark:border-slate-700/50 capitalize"
            >
              {{ tech.replace('-', ' ') }}
            </span>
          </div>
        </div>

        <div class="mt-5 border-t border-slate-200/40 dark:border-slate-800/40 pt-3 flex items-center justify-between text-[0.65rem]">
          <span class="flex items-center gap-1 font-semibold text-blue-600 dark:text-sky-400 group-hover:gap-2 transition-all">
            View Repo
            <svg class="group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-transform" xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
          </span>

          <div class="flex items-center gap-3 text-slate-500 dark:text-slate-400">
            <span *ngIf="project.stars !== undefined && project.stars > 0" class="flex items-center gap-0.5">
              <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>
              {{ project.stars }}
            </span>
            <span *ngIf="project.forks !== undefined && project.forks > 0" class="flex items-center gap-0.5">
              <svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="3" x2="6" y2="15"></line><circle cx="18" cy="6" r="3"></circle><circle cx="6" cy="18" r="3"></circle><path d="M18 9a9 9 0 0 1-9 9"></path></svg>
              {{ project.forks }}
            </span>
            <span *ngIf="project.lastUpdated">
              {{ formatDate(project.lastUpdated) }}
            </span>
          </div>
        </div>
      </a>
    </ng-container>
  </div>
</section>
