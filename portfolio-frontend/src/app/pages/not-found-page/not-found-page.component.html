<div class="flex min-h-[60vh] flex-col items-center justify-center px-4 text-center">
  <div class="space-y-6">
    <div class="space-y-2">
      <h1 class="text-9xl font-bold text-slate-900 dark:text-slate-100">404</h1>
      <h2 class="text-2xl font-semibold text-slate-800 dark:text-slate-200">
        Page Not Found
      </h2>
      <p class="text-sm text-slate-600 dark:text-slate-400">
        The page you're looking for doesn't exist or has been moved.
      </p>
    </div>

    <div class="flex flex-wrap items-center justify-center gap-3 pt-4">
      <a
        routerLink="/"
        class="flex items-center gap-2 rounded-full border border-slate-900 bg-slate-900 px-6 py-2.5 text-sm font-medium text-white transition-all hover:bg-slate-800 dark:border-slate-100 dark:bg-slate-100 dark:text-slate-900 dark:hover:bg-slate-200 cursor-pointer"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        Go Home
      </a>
      <button
        (click)="goBack()"
        class="flex items-center gap-2 rounded-full border border-slate-300 bg-white px-6 py-2.5 text-sm font-medium text-slate-700 transition-all hover:border-slate-900 hover:bg-slate-50 dark:border-slate-700 dark:bg-slate-800 dark:text-slate-300 dark:hover:border-slate-500 dark:hover:bg-slate-700 cursor-pointer"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        Go Back
      </button>
    </div>

    <!-- Decorative elements -->
    <div class="pointer-events-none absolute inset-0 -z-10 overflow-hidden">
      <div class="absolute left-1/2 top-1/2 h-96 w-96 -translate-x-1/2 -translate-y-1/2 rounded-full bg-blue-500/5 blur-3xl dark:bg-blue-400/10"></div>
    </div>
  </div>
</div>
