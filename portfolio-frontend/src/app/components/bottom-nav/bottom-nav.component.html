<nav
  aria-label="Mobile Navigation"
  class="fixed bottom-0 inset-x-0 z-30 flex md:hidden items-center justify-around py-1.5 px-2 border-t border-[var(--border-color)] bg-[var(--bg-main)]/90 backdrop-blur-xl shadow-[0_-4px_20px_rgba(0,0,0,0.15)] pb-[max(0.5rem,env(safe-area-inset-bottom))]"
>
  <a
    *ngFor="let item of navItems"
    [routerLink]="item.to"
    [class]="'flex flex-col items-center justify-center py-1 px-3 rounded-xl transition-all duration-200 cursor-pointer min-w-[56px] ' + (
      isActive(item.to)
        ? 'text-[var(--color-primary)] font-bold scale-105'
        : 'text-[var(--color-text-muted)] hover:text-[var(--color-text-bright)] active:scale-95'
    )"
  >
    <div class="relative">
      <!-- Home Icon -->
      <svg *ngIf="item.icon === 'home'" xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>

      <!-- Resume Icon -->
      <svg *ngIf="item.icon === 'resume'" xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>

      <!-- Projects Icon -->
      <svg *ngIf="item.icon === 'projects'" xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>

      <!-- System Icon -->
      <svg *ngIf="item.icon === 'system'" xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect><rect x="9" y="9" width="6" height="6"></rect><line x1="9" y1="1" x2="9" y2="4"></line><line x1="15" y1="1" x2="15" y2="4"></line><line x1="9" y1="20" x2="9" y2="23"></line><line x1="15" y1="20" x2="15" y2="23"></line><line x1="20" y1="9" x2="23" y2="9"></line><line x1="20" y1="15" x2="23" y2="15"></line><line x1="1" y1="9" x2="4" y2="9"></line><line x1="1" y1="15" x2="4" y2="15"></line></svg>

      <!-- Chat Icon -->
      <svg *ngIf="item.icon === 'chat'" xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
    </div>
    <span class="text-[0.62rem] mt-0.5 tracking-tight">{{ item.label }}</span>
    <span *ngIf="isActive(item.to)" class="w-1 h-1 rounded-full bg-[var(--color-primary)] mt-0.5 animate-pulse"></span>
    <span *ngIf="!isActive(item.to)" class="w-1 h-1 rounded-full bg-transparent mt-0.5"></span>
  </a>
</nav>
