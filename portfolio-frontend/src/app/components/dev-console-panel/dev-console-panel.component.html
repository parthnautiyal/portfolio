<!-- Shrunk tab (when dragged to edge) -->
<button
  *ngIf="isShrunk"
  (click)="expand()"
  [style.top.px]="position.y"
  [style.left.px]="shrinkSide === 'left' ? 0 : null"
  [style.right.px]="shrinkSide === 'right' ? 0 : null"
  [class]="'fixed z-40 w-11 h-11 bg-slate-900 text-green-400 border border-slate-700/50 flex items-center justify-center shadow-2xl transition-all cursor-pointer ' + (shrinkSide === 'left' ? 'rounded-r-2xl' : 'rounded-l-2xl')"
  title="Expand Dev Console"
>
  <svg *ngIf="shrinkSide === 'left'" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
  <svg *ngIf="shrinkSide === 'right'" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
</button>

<!-- Floating draggable toggle pill -->
<div
  #dragPill
  *ngIf="!isShrunk && (!isOpen || isMinimized)"
  (mousedown)="onMouseDown($event)"
  (touchstart)="onTouchStart($event)"
  [style.left.px]="position.x !== -1 ? position.x : 16"
  [style.top.px]="position.y !== -1 ? position.y : null"
  [class]="'fixed z-40 select-none print:hidden touch-none ' + (isDragging ? 'cursor-grabbing opacity-75' : 'cursor-grab')"
>
  <button
    [class]="'flex items-center gap-2 p-2.5 pr-4 rounded-full shadow-lg border backdrop-blur-md transition-all pointer-events-none ' + (
      isOpen
        ? 'bg-slate-950 text-green-400 border-green-500/30'
        : 'bg-slate-900 text-green-400 border-slate-700/50'
    ) + ' ' + (!hasOpened && !isOpen ? 'animate-highlight-pulse' : '')"
    title="Toggle Dev Console (Ctrl + `)"
  >
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
    <span class="text-[0.62rem] font-bold text-green-400/80">dev-console</span>
  </button>
</div>

<!-- Console panel (Terminal Window) -->
<div
  *ngIf="isOpen && !isShrunk"
  (mousedown)="$event.stopPropagation()"
  (touchstart)="$event.stopPropagation()"
  [class]="'fixed z-50 border border-green-500/30 bg-slate-950/98 text-green-400 font-mono flex flex-col shadow-2xl transition-all duration-150 ' + (isMaximized ? 'inset-2 rounded-xl' : 'rounded-xl w-[94vw] sm:w-[600px] shadow-[0_0_50px_rgba(0,0,0,0.8)]')"
  [style.top]="isMaximized ? '8px' : 'auto'"
  [style.right]="isMaximized ? '8px' : 'auto'"
  [style.bottom]="isMaximized ? '8px' : 'calc(100vh - ' + position.y + 'px + 8px)'"
  [style.left]="isMaximized ? '8px' : ((position.x !== -1 ? position.x : 16) + 'px')"
>
  <!-- macOS/Linux Terminal Title Bar -->
  <div
    (dblclick)="maximize()"
    class="flex items-center justify-between border-b border-green-500/20 bg-slate-900/80 px-3.5 py-2.5 cursor-default shrink-0 select-none rounded-t-xl"
    title="Double-click to toggle fullscreen"
  >
    <div class="flex items-center gap-2">
      <!-- Red: close -->
      <button
        (click)="isOpen = false"
        class="h-3 w-3 rounded-full bg-red-500/90 hover:bg-red-400 transition-colors cursor-pointer flex items-center justify-center group"
        title="Close"
      >
        <svg class="opacity-0 group-hover:opacity-100 transition-opacity text-slate-950" xmlns="http://www.w3.org/2000/svg" width="6" height="6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
      <!-- Yellow: minimize/restore -->
      <button
        (click)="minimize()"
        class="h-3 w-3 rounded-full bg-yellow-500/90 hover:bg-yellow-400 transition-colors cursor-pointer flex items-center justify-center group"
        title="Minimize"
      >
        <svg class="opacity-0 group-hover:opacity-100 transition-opacity text-slate-950" xmlns="http://www.w3.org/2000/svg" width="8" height="2" viewBox="0 0 10 2"><line x1="0" y1="1" x2="10" y2="1" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <!-- Green: maximize toggle -->
      <button
        (click)="maximize()"
        class="h-3 w-3 rounded-full bg-green-500/90 hover:bg-green-400 transition-colors cursor-pointer flex items-center justify-center group"
        [title]="isMaximized ? 'Restore' : 'Fullscreen'"
      >
        <svg class="opacity-0 group-hover:opacity-100 transition-opacity text-slate-950" xmlns="http://www.w3.org/2000/svg" width="7" height="7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"></polyline><polyline points="9 21 3 21 3 15"></polyline><line x1="21" y1="3" x2="14" y2="10"></line><line x1="3" y1="21" x2="10" y2="14"></line></svg>
      </button>
      <span class="text-[0.68rem] font-bold text-slate-400 ml-1.5 flex items-center gap-1.5">
        <span class="w-1.5 h-1.5 rounded-full bg-green-500 animate-pulse"></span>
        guest@parth-macbook: ~
      </span>
    </div>
    <span class="text-[0.6rem] text-slate-500 font-semibold tracking-wider">bash · 80x24</span>
  </div>

  <!-- Terminal Viewport (Clicking anywhere focuses prompt) -->
  <div
    *ngIf="!isMinimized"
    (click)="focusInput($event)"
    [class]="'overflow-y-auto p-3.5 space-y-1 text-[0.72rem] select-text scrollbar-thin scrollbar-thumb-green-500/20 cursor-text ' + (isMaximized ? 'flex-1' : 'h-[440px]')"
  >
    <!-- Historical Output lines -->
    <div
      *ngFor="let entry of history"
      class="leading-relaxed whitespace-pre-wrap break-words"
      [class]="entry.segs ? '' : (
        entry.type === 'error'   ? 'text-red-400' :
        entry.type === 'success' ? 'text-green-300 font-semibold' :
        entry.type === 'dim'     ? 'text-slate-500' :
        entry.type === 'input'   ? 'text-slate-300' :
        'text-green-400'
      )"
    >
      <ng-container *ngIf="entry.segs">
        <span *ngFor="let seg of entry.segs" [class]="seg.c">{{ seg.t }}</span>
      </ng-container>
      <ng-container *ngIf="!entry.segs">{{ entry.text }}</ng-container>
    </div>

    <!-- Active Inline Terminal Prompt (Positioned directly below last output) -->
    <form
      (submit)="onSubmit($event)"
      class="flex items-center gap-2 pt-1 min-w-0"
    >
      <span class="text-green-400 font-semibold shrink-0 select-none">guest@parth:~$</span>
      <div class="relative flex-1 flex items-center min-w-0">
        <input
          #cmdInput
          [(ngModel)]="inputVal"
          name="cmdInput"
          (keydown)="onKeyDown($event)"
          (input)="onInputChange()"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          class="w-full text-[0.72rem] font-mono bg-transparent border-none outline-none text-green-300 caret-green-400 p-0 m-0 focus:ring-0"
        />
      </div>
    </form>

    <!-- Interactive Autocomplete Grid / Tab-Cycling Selection Bar -->
    <div
      *ngIf="autocompleteOptions.length > 0"
      class="mt-2.5 p-2 bg-slate-900/90 border border-green-500/20 rounded-lg shadow-inner select-none"
    >
      <div class="text-[0.62rem] text-slate-400 font-bold mb-1.5 flex items-center justify-between">
        <span>TAB: Cycle Options · ENTER: Select · ESC: Close</span>
        <span class="text-green-400">{{ autocompleteIndex + 1 }} / {{ autocompleteOptions.length }}</span>
      </div>
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-1.5">
        <button
          type="button"
          *ngFor="let opt of autocompleteOptions; let i = index"
          (click)="selectAutocomplete(opt, $event)"
          [class]="'text-left px-2 py-1 rounded text-[0.68rem] transition-all cursor-pointer font-mono truncate ' + (
            i === autocompleteIndex
              ? 'bg-green-500 text-slate-950 font-bold shadow-md shadow-green-500/20 scale-[1.02]'
              : 'text-slate-300 bg-slate-800/60 hover:bg-slate-800 hover:text-green-300'
          )"
        >
          {{ opt }}
        </button>
      </div>
    </div>

    <div #consoleEnd class="h-2"></div>
  </div>
</div>
