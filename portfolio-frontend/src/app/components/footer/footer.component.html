<footer class="mt-16 border-t border-slate-200 dark:border-slate-800">
  <div class="mx-auto flex max-w-[1600px] flex-col items-center justify-between gap-2 px-6 md:px-12 xl:px-16 py-6 text-xs text-slate-500 dark:text-slate-400 md:flex-row">
    <span>
      © {{ currentYear }} {{ personal.name }}
    </span>
    <div class="flex gap-4">
      <a
        [href]="personal.github"
        target="_blank"
        rel="noreferrer"
        class="hover:text-slate-700 dark:hover:text-slate-200"
        (click)="onLinkClick('GitHub', personal.github)"
      >
        GitHub
      </a>
      <a
        [href]="personal.linkedin"
        target="_blank"
        rel="noreferrer"
        class="hover:text-slate-700 dark:hover:text-slate-200"
        (click)="onLinkClick('LinkedIn', personal.linkedin)"
      >
        LinkedIn
      </a>
      <a
        [href]="personal.leetcode"
        target="_blank"
        rel="noreferrer"
        class="hover:text-slate-700 dark:hover:text-slate-200"
        (click)="onLinkClick('LeetCode', personal.leetcode)"
      >
        LeetCode
      </a>
    </div>
  </div>
</footer>
